<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b1c">
  <title>Cyber Runner — Neon Dash</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #070916; }
    body { display: grid; place-items: center; padding: 12px; }
    .shell { width: min(100%, 1100px); position: relative; }
    canvas { display: block; width: 100%; aspect-ratio: 16 / 9; max-height: calc(100dvh - 24px); border: 1px solid #31f8ff70; border-radius: 14px; background: #090c20; box-shadow: 0 0 35px #00eeff22, inset 0 0 30px #00eeff0b; touch-action: none; cursor: pointer; }
    .hint { position: absolute; bottom: 13px; left: 0; right: 0; text-align: center; color: #b4c6df; font-size: clamp(10px, 1.5vw, 13px); pointer-events: none; text-shadow: 0 2px 8px #000; }
    @media (max-width: 650px) { body { padding: 0; } canvas { border-radius: 0; max-height: 100dvh; } .hint { bottom: 8px; } }
  </style>
</head>
<body>
  <main class="shell" aria-label="Cyber Runner, jeu d'arcade">
    <canvas id="game" width="960" height="540" role="img" aria-label="Jeu Cyber Runner : sauter par-dessus les obstacles. Espace, flèche haut ou toucher pour jouer."></canvas>
    <div class="hint">ESPACE / ↑ / CLIC / TOUCHER · SAUTER / RECOMMENCER</div>
  </main>
  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const W = 960, H = 540, GROUND = 414, SHIP_X = 175;
      const BEST_KEY = 'cyber-runner-best-v1';
      const rand = (a, b) => a + Math.random() * (b - a);
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      let best = 0;
      try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (_) {}

      let state = 'ready', score = 0, distance = 0, speed = 350, spawnIn = 1;
      let time = 0, lastTime = 0, shake = 0, flash = 0;
      let obstacles = [], particles = [], stars = [];
      const ship = { x: SHIP_X, y: GROUND - 52, w: 78, h: 49, vy: 0, grounded: true };
      for (let i = 0; i < 75; i++) stars.push({ x: rand(0, W), y: rand(18, GROUND - 90), size: rand(.5, 2), phase: rand(0, 7), layer: rand(.15, .8) });

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      let audioCtx;
      function audio() {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return null;
          if (!audioCtx) audioCtx = new Ctx();
          if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
          return audioCtx;
        } catch (_) { return null; }
      }
      function tone(start, end, duration, type = 'sine', volume = .1, delay = 0) {
        const ac = audio(); if (!ac) return;
        try {
          const now = ac.currentTime + delay;
          const osc = ac.createOscillator(), gain = ac.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(Math.max(1, start), now);
          osc.frequency.exponentialRampToValueAtTime(Math.max(1, end), now + duration);
          gain.gain.setValueAtTime(Math.max(.0001, volume), now);
          gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
          osc.connect(gain); gain.connect(ac.destination);
          osc.start(now); osc.stop(now + duration + .02);
        } catch (_) {}
      }
      function burst(x, y, color, count = 12, power = 180) {
        for (let i = 0; i < count; i++) {
          const a = rand(0, Math.PI * 2), v = rand(power * .2, power);
          particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.25, .75), max: .75, size: rand(2, 6), color });
        }
      }
      function reset() {
        state = 'playing'; score = 0; distance = 0; speed = 350; spawnIn = 1.05;
        obstacles = []; particles = []; shake = 0; flash = 0;
        ship.y = GROUND - ship.h; ship.vy = 0; ship.grounded = true;
      }
      function action() {
        audio();
        if (state !== 'playing') reset();
        if (ship.grounded) {
          ship.vy = -760; ship.grounded = false;
          burst(ship.x + 28, GROUND - 5, '#34f6ff', 9, 105);
          tone(270, 680, .18, 'triangle', .075);
        }
      }
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
          e.preventDefault();
          if (!e.repeat) action();
        }
      });
      canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); action(); });
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      function addObstacle() {
        const tall = Math.random() < .4;
        const w = tall ? rand(35, 47) : rand(49, 67);
        const h = tall ? rand(79, 103) : rand(44, 65);
        obstacles.push({ x: W + 30, y: GROUND - h, w, h, scored: false, phase: rand(0, 6.28) });
        // Calibrated gap: at higher speeds, give the player more distance to react.
        spawnIn = rand(1.02, 1.42) + (speed - 350) / 2000;
      }
      function gameOver() {
        state = 'over'; shake = 15; flash = .35;
        burst(ship.x + ship.w / 2, ship.y + ship.h / 2, '#ff3d99', 32, 320);
        burst(ship.x + ship.w / 2, ship.y + ship.h / 2, '#32f5ff', 20, 230);
        tone(320, 55, .43, 'sawtooth', .12);
        tone(110, 35, .5, 'triangle', .09, .09);
        if (score > best) {
          best = score;
          try { localStorage.setItem(BEST_KEY, String(best)); } catch (_) {}
        }
      }
      function update(dt) {
        time += dt;
        shake = Math.max(0, shake - dt * 38);
        flash = Math.max(0, flash - dt);
        for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 330 * dt; p.life -= dt; }
        particles = particles.filter(p => p.life > 0);
        if (state !== 'playing') return;
        speed = Math.min(690, 350 + distance * .008);
        distance += speed * dt;
        ship.vy += 2000 * dt;
        ship.y += ship.vy * dt;
        if (ship.y >= GROUND - ship.h) {
          if (!ship.grounded) {
            burst(ship.x + 36, GROUND - 3, '#30f4fa', 6, 70);
            tone(110, 65, .09, 'triangle', .025);
          }
          ship.y = GROUND - ship.h; ship.vy = 0; ship.grounded = true;
        }
        if (Math.random() < dt * 27) {
          particles.push({ x: ship.x - 9, y: ship.y + 31 + rand(-6, 6), vx: rand(-210, -70), vy: rand(-35, 35), life: rand(.12, .35), max: .35, size: rand(2, 5), color: Math.random() < .5 ? '#29f9ff' : '#ff4cc6' });
        }
        spawnIn -= dt;
        if (spawnIn <= 0) addObstacle();
        for (const o of obstacles) {
          o.x -= speed * dt;
          if (!o.scored && o.x + o.w < ship.x) {
            o.scored = true; score += 10;
            tone(620, 900, .11, 'sine', .055);
            tone(880, 1180, .13, 'sine', .04, .07);
            burst(o.x + o.w, o.y + 8, '#ffe363', 6, 85);
          }
          if (ship.x + 15 < o.x + o.w - 7 && ship.x + ship.w - 13 > o.x + 8 &&
              ship.y + 11 < o.y + o.h - 6 && ship.y + ship.h - 8 > o.y + 7) {
            gameOver(); break;
          }
        }
        obstacles = obstacles.filter(o => o.x + o.w > -40);
      }

      function line(x1, y1, x2, y2, color, width = 1) {
        ctx.strokeStyle = color; ctx.lineWidth = width;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
      function backdrop() {
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#090b1e'); sky.addColorStop(.66, '#151037'); sky.addColorStop(1, '#080c1e');
        ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
        const glow = ctx.createRadialGradient(700, 270, 15, 700, 270, 390);
        glow.addColorStop(0, '#e11bb322'); glow.addColorStop(1, '#e11bb300');
        ctx.fillStyle = glow; ctx.fillRect(0, 0, W, GROUND);
        for (const s of stars) {
          const x = ((s.x - distance * s.layer * .08) % W + W) % W;
          ctx.globalAlpha = .25 + .55 * (.5 + .5 * Math.sin(time * 2 + s.phase));
          ctx.fillStyle = '#9fefff'; ctx.fillRect(x, s.y, s.size, s.size);
        }
        ctx.globalAlpha = 1;
        // Parallax city silhouettes.
        for (let layer = 0; layer < 2; layer++) {
          const unit = layer ? 71 : 106;
          const shift = (distance * (layer ? .24 : .11)) % unit;
          ctx.fillStyle = layer ? '#151532' : '#11122a';
          for (let i = -1; i < 16; i++) {
            const x = i * unit - shift;
            const seed = (i + Math.floor(distance * (layer ? .24 : .11) / unit) + 10000);
            const h = (layer ? 85 : 125) + (Math.sin(seed * 12.3) * .5 + .5) * (layer ? 85 : 90);
            ctx.fillRect(x, GROUND - h, unit - (layer ? 8 : 15), h);
            if (layer) {
              ctx.fillStyle = '#f430861f';
              for (let j = 0; j < 3; j++) for (let k = 0; k < 5; k++) {
                if ((seed + j * 3 + k * 7) % 4 !== 0) ctx.fillRect(x + 10 + j * 17, GROUND - h + 15 + k * 20, 5, 9);
              }
              ctx.fillStyle = '#151532';
            }
          }
        }
        const floor = ctx.createLinearGradient(0, GROUND, 0, H);
        floor.addColorStop(0, '#151b3c'); floor.addColorStop(1, '#090d20');
        ctx.fillStyle = floor; ctx.fillRect(0, GROUND, W, H - GROUND);
        ctx.shadowColor = '#28edff'; ctx.shadowBlur = 15;
        line(0, GROUND, W, GROUND, '#37edff', 3);
        ctx.shadowBlur = 0;
        for (let i = 0; i < 15; i++) {
          const x = ((i * 90 - distance * .7) % (W + 90) + (W + 90)) % (W + 90);
          line(x, GROUND + 10, x - 70, H, '#2defff2c');
        }
        for (let j = 1; j < 5; j++) {
          const y = GROUND + (j / 4) ** 1.6 * (H - GROUND);
          line(0, y, W, y, '#25e4ff20');
        }
      }
      function drawShip() {
        const x = ship.x, y = ship.y + (ship.grounded && state !== 'over' ? Math.sin(time * 10) * 1.5 : 0);
        ctx.save(); ctx.translate(x, y);
        if (state !== 'over') {
          ctx.shadowColor = '#1ef9ff'; ctx.shadowBlur = 23;
          const flame = 13 + Math.sin(time * 38) * 6;
          ctx.fillStyle = '#29f8ff';
          ctx.beginPath(); ctx.moveTo(8, 27); ctx.lineTo(-flame - 5, 19); ctx.lineTo(-flame, 34); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#ff45b9';
          ctx.beginPath(); ctx.moveTo(10, 28); ctx.lineTo(-flame * .6, 24); ctx.lineTo(-flame * .5, 31); ctx.closePath(); ctx.fill();
          ctx.shadowBlur = 18;
          const metal = ctx.createLinearGradient(0, 5, 0, 46);
          metal.addColorStop(0, '#dafaff'); metal.addColorStop(.35, '#34d8f9'); metal.addColorStop(1, '#22729c');
          ctx.fillStyle = metal; ctx.strokeStyle = '#70ffff'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(2, 29); ctx.lineTo(19, 11); ctx.lineTo(53, 8); ctx.lineTo(78, 24); ctx.lineTo(54, 37); ctx.lineTo(18, 41); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.shadowColor = '#ff49c5'; ctx.fillStyle = '#fa3cb5';
          ctx.beginPath(); ctx.moveTo(29, 15); ctx.lineTo(50, 12); ctx.lineTo(59, 20); ctx.lineTo(28, 22); ctx.closePath(); ctx.fill();
          ctx.shadowBlur = 0; line(21, 35, 58, 31, '#d8ffff', 2);
        }
        ctx.restore();
      }
      function drawObstacle(o) {
        const pulse = Math.sin(time * 6 + o.phase) * 3;
        ctx.save(); ctx.shadowColor = '#fa3b9d'; ctx.shadowBlur = 18 + pulse;
        ctx.fillStyle = '#291431'; ctx.strokeStyle = '#ff4ca6'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(o.x + 8, o.y); ctx.lineTo(o.x + o.w - 8, o.y);
        ctx.lineTo(o.x + o.w, o.y + 12); ctx.lineTo(o.x + o.w, GROUND);
        ctx.lineTo(o.x, GROUND); ctx.lineTo(o.x, o.y + 12); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0;
        for (let y = o.y + 18; y < GROUND - 7; y += 19) {
          line(o.x + 8, y, o.x + o.w - 8, y, '#ff5f9a90', 2);
        }
        ctx.fillStyle = '#ffc4e1'; ctx.fillRect(o.x + 11, o.y + 8, o.w - 22, 4);
        ctx.restore();
      }
      function ui() {
        ctx.textAlign = 'left'; ctx.shadowColor = '#41ecff'; ctx.shadowBlur = 10;
        ctx.fillStyle = '#e8fcff'; ctx.font = 'bold 29px system-ui, sans-serif'; ctx.fillText('CYBER RUNNER', 28, 46);
        ctx.shadowBlur = 0; ctx.fillStyle = '#79d8ed'; ctx.font = 'bold 15px system-ui, sans-serif';
        ctx.fillText('NEON DASH // 01', 30, 69);
        ctx.textAlign = 'right'; ctx.fillStyle = '#e9fcff'; ctx.font = 'bold 29px system-ui, sans-serif';
        ctx.fillText(String(score).padStart(5, '0'), W - 28, 46);
        ctx.fillStyle = '#ff84c6'; ctx.font = 'bold 15px system-ui, sans-serif';
        ctx.fillText('RECORD  ' + String(best).padStart(5, '0'), W - 29, 70);
      }
      function overlay() {
        if (state === 'playing') return;
        ctx.fillStyle = '#050818ac'; ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.shadowColor = state === 'ready' ? '#34f4ff' : '#ff349c'; ctx.shadowBlur = 25;
        ctx.fillStyle = state === 'ready' ? '#e2feff' : '#ff9ac9';
        ctx.font = '900 64px system-ui, sans-serif';
        ctx.fillText(state === 'ready' ? 'CYBER RUNNER' : 'FIN DE PARTIE', W / 2, 190);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#cee7f0'; ctx.font = '20px system-ui, sans-serif';
        ctx.fillText(state === 'ready' ? 'Un saut, un timing, une course sans fin.' : `Score : ${score}   •   Record : ${best}`, W / 2, 238);
        ctx.fillStyle = '#16253d'; ctx.strokeStyle = '#41f3ff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(W / 2 - 175, 278, 350, 66, 12); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#e6fdff'; ctx.font = 'bold 20px system-ui, sans-serif';
        ctx.fillText(state === 'ready' ? '▶  JOUER' : '↻  RECOMMENCER', W / 2, 320);
        ctx.fillStyle = '#a4bccc'; ctx.font = '16px system-ui, sans-serif';
        ctx.fillText('Espace  ·  ↑  ·  Clic  ·  Toucher', W / 2, 382);
      }
      function draw() {
        ctx.save();
        if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
        backdrop();
        for (const o of obstacles) drawObstacle(o);
        drawShip();
        for (const p of particles) {
          ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
          ctx.shadowColor = p.color; ctx.shadowBlur = 12; ctx.fillStyle = p.color;
          ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        }
        ctx.globalAlpha = 1; ctx.shadowBlur = 0;
        if (flash) { ctx.fillStyle = `rgba(255,80,171,${flash * .8})`; ctx.fillRect(0, 0, W, H); }
        ui(); overlay(); ctx.restore();
      }
      function frame(ts) {
        if (!lastTime) lastTime = ts;
        const dt = Math.min((ts - lastTime) / 1000, .033);
        lastTime = ts; update(dt); draw(); requestAnimationFrame(frame);
      }
      document.addEventListener('visibilitychange', () => { lastTime = 0; });
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
