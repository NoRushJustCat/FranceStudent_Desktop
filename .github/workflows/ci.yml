name: CI — France Student Desktop & ATG Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  plugin-fs-atg:
    name: Plugin Antigravity (fs-atg)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/fs-atg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - run: npm run check
      - run: npm test

  fs-code-frontend:
    name: FS Code Frontend (Svelte 5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run build
