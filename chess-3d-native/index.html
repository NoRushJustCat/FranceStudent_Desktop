<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Échecs 3D — Native Edition</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --panel: rgba(20, 22, 30, 0.78);
      --panel-border: rgba(255, 255, 255, 0.10);
      --panel-top: rgba(255, 255, 255, 0.18);
      --fg: #f5f5f7;
      --muted: #9aa0ad;
      --accent: #0a84ff;
      --ok: #30d158;
      --warn: #ff9f0a;
      --bad: #ff453a;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
      --mono: "SF Mono", "JetBrains Mono", ui-monospace, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #192136 0%, #0b0d12 72%);
      color: var(--fg);
      font-family: var(--font);
      user-select: none;
    }

    #canvas-host {
      position: fixed;
      inset: 0;
      z-index: 1;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .hud {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      inset: 14px;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 14px;
    }

    .glass {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border: 1px solid var(--panel-border);
      border-top-color: var(--panel-top);
      border-radius: 16px;
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.5);
    }

    .side-col {
      width: 286px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 100%;
    }

    .card {
      padding: 13px 14px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(10, 132, 255, 0.18);
      color: #6ab4ff;
      letter-spacing: 0.03em;
    }

    .turn-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 10px;
    }
    .turn-left {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 600;
    }
    .turn-orb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      transition: background 200ms ease, box-shadow 200ms ease;
    }
    .turn-orb.w {
      background: #f5f2eb;
      box-shadow: 0 0 12px rgba(255, 248, 232, 0.6);
    }
    .turn-orb.b {
      background: #1c1f27;
      box-shadow: 0 0 12px rgba(10, 132, 255, 0.45);
    }
    .status-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(48, 209, 88, 0.15);
      color: var(--ok);
    }
    .status-pill.check { background: rgba(255, 159, 10, 0.20); color: var(--warn); }
    .status-pill.over { background: rgba(255, 69, 58, 0.22); color: #ff7b72; }
    .status-pill.think { background: rgba(10, 132, 255, 0.20); color: #7cc0ff; }

    .ctrl-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 8px;
    }
    .field-lbl {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }
    select, button {
      font: inherit;
      color: var(--fg);
    }
    select {
      width: 100%;
      background: rgba(12, 14, 20, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 9px;
      padding: 6px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .btn {
      border: 0;
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.08);
      color: var(--fg);
      transition: background 140ms ease, transform 90ms ease;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.15); }
    .btn:active { transform: scale(0.95); }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.primary:hover { background: #369bff; }
    .btn.on { background: rgba(48, 209, 88, 0.22); color: var(--ok); }

    .captures-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }
    .cap-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-height: 22px;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.035);
    }
    .cap-pieces {
      letter-spacing: 1px;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cap-adv {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--ok);
    }

    .moves-card {
      flex: 1;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .moves-list {
      flex: 1;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 11.5px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-right: 4px;
    }
    .moves-list::-webkit-scrollbar { width: 5px; }
    .moves-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.16); border-radius: 99px; }
    .move-row {
      display: grid;
      grid-template-columns: 32px 1fr 1fr;
      gap: 6px;
      padding: 3.5px 6px;
      border-radius: 6px;
    }
    .move-row:nth-child(odd) { background: rgba(255, 255, 255, 0.03); }
    .move-num { color: var(--muted); }

    .right-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
    }
    .cam-bar {
      padding: 8px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: 340px;
      justify-content: flex-end;
    }
    .hint-toast {
      padding: 8px 12px;
      font-size: 11.5px;
      color: var(--muted);
      max-width: 320px;
      text-align: right;
    }
    .hint-toast strong { color: var(--fg); }

    /* Promotion modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(5, 7, 11, 0.68);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop[hidden] { display: none; }
    .promo-card {
      padding: 18px 20px;
      text-align: center;
      min-width: 280px;
    }
    .promo-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .promo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .promo-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 8px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(255, 255, 255, 0.06);
      cursor: pointer;
      transition: transform 120ms ease, background 150ms ease;
    }
    .promo-btn:hover {
      background: rgba(10, 132, 255, 0.25);
      transform: translateY(-2px);
    }
    .promo-btn span:first-child { font-size: 26px; line-height: 1; }
    .promo-btn span:last-child { font-size: 10.5px; color: var(--muted); }

    @media (max-width: 820px) {
      .hud { flex-direction: column; }
      .side-col { width: 100%; max-height: 44%; }
      .right-col { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div id="canvas-host"></div>

  <div class="hud">
    <div class="side-col">
      <div class="glass card">
        <div class="header-row">
          <div class="title">Échecs 3D <span class="badge">NATIF</span></div>
          <button type="button" class="btn on" id="soundBtn" title="Activer/couper le son">Son : Oui</button>
        </div>

        <div class="turn-box">
          <div class="turn-left">
            <span class="turn-orb w" id="turnOrb"></span>
            <span id="turnLabel">Trait aux Blancs</span>
          </div>
          <span class="status-pill" id="statusPill">En cours</span>
        </div>

        <div class="ctrl-grid">
          <div>
            <label class="field-lbl" for="modeSelect">Mode de jeu</label>
            <select id="modeSelect">
              <option value="ai" selected>Joueur vs IA</option>
              <option value="local">2 Joueurs (local)</option>
              <option value="aivsai">IA vs IA (démo)</option>
            </select>
          </div>
          <div>
            <label class="field-lbl" for="depthSelect">Niveau IA</label>
            <select id="depthSelect">
              <option value="1">Rapide (prof. 1)</option>
              <option value="2" selected>Équilibré (prof. 2)</option>
              <option value="3">Difficile (prof. 3)</option>
            </select>
          </div>
        </div>

        <div class="btn-row">
          <button type="button" class="btn primary" id="newGameBtn">Nouvelle partie</button>
          <button type="button" class="btn" id="undoBtn">Annuler coup</button>
          <button type="button" class="btn" id="hintBtn">Indice</button>
        </div>
      </div>

      <div class="glass card">
        <div class="field-lbl" style="margin-bottom:6px">Pièces capturées</div>
        <div class="captures-box">
          <div class="cap-line">
            <span class="cap-pieces" id="capWhite">—</span>
            <span class="cap-adv" id="advWhite"></span>
          </div>
          <div class="cap-line">
            <span class="cap-pieces" id="capBlack">—</span>
            <span class="cap-adv" id="advBlack"></span>
          </div>
        </div>
      </div>

      <div class="glass card moves-card">
        <div class="field-lbl" style="margin-bottom:6px">Historique des coups</div>
        <div class="moves-list" id="movesList"></div>
      </div>
    </div>

    <div class="right-col">
      <div class="glass cam-bar">
        <button type="button" class="btn" data-cam="white">Vue Blancs</button>
        <button type="button" class="btn" data-cam="black">Vue Noirs</button>
        <button type="button" class="btn" data-cam="top">Dessus</button>
        <button type="button" class="btn" id="autoRotateBtn">Orbite auto</button>
      </div>

      <div class="glass hint-toast" id="hintToast">
        <strong>Contrôles 3D :</strong> Clic sur une pièce puis sur une case · Glisser pour tourner · Molette pour zoomer · Clic droit pour incliner.
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="promoModal" hidden>
    <div class="glass promo-card">
      <div class="promo-title">Promotion du pion</div>
      <div class="promo-grid" id="promoGrid"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script>
    (() => {
      'use strict';

      /* ================================================================
       * 1. MOTEUR D'ÉCHECS COMPLET (Roque, En Passant, Promotion, IA)
       * ================================================================ */
      const PIECE_VAL = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
      const UNICODE_W = { k: '♔', q: '♕', r: '♖', b: '♗', n: '♘', p: '♙' };
      const UNICODE_B = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };

      const PST = {
        p: [
          0,  0,  0,  0,  0,  0,  0,  0,
         50, 50, 50, 50, 50, 50, 50, 50,
         10, 10, 20, 30, 30, 20, 10, 10,
          5,  5, 10, 27, 27, 10,  5,  5,
          0,  0,  0, 24, 24,  0,  0,  0,
          5, -5,-10,  0,  0,-10, -5,  5,
          5, 10, 10,-22,-22, 10, 10,  5,
          0,  0,  0,  0,  0,  0,  0,  0,
        ],
        n: [
        -50,-40,-30,-30,-30,-30,-40,-50,
        -40,-20,  0,  0,  0,  0,-20,-40,
        -30,  0, 10, 15, 15, 10,  0,-30,
        -30,  5, 15, 20, 20, 15,  5,-30,
        -30,  0, 15, 20, 20, 15,  0,-30,
        -30,  5, 10, 15, 15, 10,  5,-30,
        -40,-20,  0,  5,  5,  0,-20,-40,
        -50,-40,-30,-30,-30,-30,-40,-50,
        ],
        b: [
        -20,-10,-10,-10,-10,-10,-10,-20,
        -10,  0,  0,  0,  0,  0,  0,-10,
        -10,  0,  5, 10, 10,  5,  0,-10,
        -10,  5,  5, 10, 10,  5,  5,-10,
        -10,  0, 10, 10, 10, 10,  0,-10,
        -10, 10, 10, 10, 10, 10, 10,-10,
        -10,  5,  0,  0,  0,  0,  5,-10,
        -20,-10,-10,-10,-10,-10,-10,-20,
        ],
        r: [
          0,  0,  0,  0,  0,  0,  0,  0,
          5, 10, 10, 10, 10, 10, 10,  5,
         -5,  0,  0,  0,  0,  0,  0, -5,
         -5,  0,  0,  0,  0,  0,  0, -5,
         -5,  0,  0,  0,  0,  0,  0, -5,
         -5,  0,  0,  0,  0,  0,  0, -5,
         -5,  0,  0,  0,  0,  0,  0, -5,
          0,  0,  0,  5,  5,  0,  0,  0,
        ],
        q: [
        -20,-10,-10, -5, -5,-10,-10,-20,
        -10,  0,  0,  0,  0,  0,  0,-10,
        -10,  0,  5,  5,  5,  5,  0,-10,
         -5,  0,  5,  5,  5,  5,  0, -5,
          0,  0,  5,  5,  5,  5,  0, -5,
        -10,  5,  5,  5,  5,  5,  0,-10,
        -10,  0,  5,  0,  0,  0,  0,-10,
        -20,-10,-10, -5, -5,-10,-10,-20,
        ],
        k: [
        -30,-40,-40,-50,-50,-40,-40,-30,
        -30,-40,-40,-50,-50,-40,-40,-30,
        -30,-40,-40,-50,-50,-40,-40,-30,
        -30,-40,-40,-50,-50,-40,-40,-30,
        -20,-30,-30,-40,-40,-30,-30,-20,
        -10,-20,-20,-20,-20,-20,-20,-10,
         20, 20,  0,  0,  0,  0, 20, 20,
         20, 30, 10,  0,  0, 10, 30, 20,
        ],
      };

      const FILES = 'abcdefgh';
      function sqName(r, c) { return FILES[c] + (8 - r); }
      function inBounds(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }

      function createInitialState() {
        const board = Array.from({ length: 8 }, () => Array(8).fill(null));
        const back = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
        for (let c = 0; c < 8; c++) {
          board[0][c] = { color: 'b', type: back[c], id: `b_${back[c]}_${c}` };
          board[1][c] = { color: 'b', type: 'p', id: `b_p_${c}` };
          board[6][c] = { color: 'w', type: 'p', id: `w_p_${c}` };
          board[7][c] = { color: 'w', type: back[c], id: `w_${back[c]}_${c}` };
        }
        return {
          board,
          turn: 'w',
          castling: { wK: true, wQ: true, bK: true, bQ: true },
          ep: null, // { r, c }
          halfMove: 0,
          fullMove: 1,
          capturedW: [],
          capturedB: [],
          history: [],
          snapshots: [],
        };
      }

      function cloneState(s) {
        return {
          board: s.board.map((row) => row.map((p) => (p ? { ...p } : null))),
          turn: s.turn,
          castling: { ...s.castling },
          ep: s.ep ? { ...s.ep } : null,
          halfMove: s.halfMove,
          fullMove: s.fullMove,
          capturedW: [...s.capturedW],
          capturedB: [...s.capturedB],
          history: [...s.history],
          snapshots: s.snapshots,
        };
      }

      function findKing(board, color) {
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = board[r][c];
            if (p && p.color === color && p.type === 'k') return { r, c };
          }
        }
        return null;
      }

      function isSquareAttacked(board, r, c, byColor) {
        // Pawns
        const pDir = byColor === 'w' ? 1 : -1;
        for (const dc of [-1, 1]) {
          const pr = r + pDir, pc = c + dc;
          if (inBounds(pr, pc)) {
            const p = board[pr][pc];
            if (p && p.color === byColor && p.type === 'p') return true;
          }
        }
        // Knights
        for (const [dr, dc] of [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]) {
          const nr = r + dr, nc = c + dc;
          if (inBounds(nr, nc)) {
            const p = board[nr][nc];
            if (p && p.color === byColor && p.type === 'n') return true;
          }
        }
        // King
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (!dr && !dc) continue;
            const kr = r + dr, kc = c + dc;
            if (inBounds(kr, kc)) {
              const p = board[kr][kc];
              if (p && p.color === byColor && p.type === 'k') return true;
            }
          }
        }
        // Rook / Queen lines
        for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
          let nr = r + dr, nc = c + dc;
          while (inBounds(nr, nc)) {
            const p = board[nr][nc];
            if (p) {
              if (p.color === byColor && (p.type === 'r' || p.type === 'q')) return true;
              break;
            }
            nr += dr; nc += dc;
          }
        }
        // Bishop / Queen diagonals
        for (const [dr, dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]) {
          let nr = r + dr, nc = c + dc;
          while (inBounds(nr, nc)) {
            const p = board[nr][nc];
            if (p) {
              if (p.color === byColor && (p.type === 'b' || p.type === 'q')) return true;
              break;
            }
            nr += dr; nc += dc;
          }
        }
        return false;
      }

      function inCheck(board, color) {
        const k = findKing(board, color);
        if (!k) return false;
        return isSquareAttacked(board, k.r, k.c, color === 'w' ? 'b' : 'w');
      }

      function pseudoMoves(s, color) {
        const moves = [];
        const b = s.board;
        const enemy = color === 'w' ? 'b' : 'w';

        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = b[r][c];
            if (!p || p.color !== color) continue;

            if (p.type === 'p') {
              const dir = color === 'w' ? -1 : 1;
              const startRow = color === 'w' ? 6 : 1;
              const promoRow = color === 'w' ? 0 : 7;
              const r1 = r + dir;
              if (inBounds(r1, c) && !b[r1][c]) {
                if (r1 === promoRow) {
                  for (const promo of ['q', 'r', 'b', 'n']) moves.push({ fr: r, fc: c, tr: r1, tc: c, promo });
                } else {
                  moves.push({ fr: r, fc: c, tr: r1, tc: c });
                  const r2 = r + dir * 2;
                  if (r === startRow && !b[r2][c]) {
                    moves.push({ fr: r, fc: c, tr: r2, tc: c, doublePawn: true });
                  }
                }
              }
              for (const dc of [-1, 1]) {
                const tc = c + dc;
                if (!inBounds(r1, tc)) continue;
                const target = b[r1][tc];
                if (target && target.color === enemy) {
                  if (r1 === promoRow) {
                    for (const promo of ['q', 'r', 'b', 'n']) moves.push({ fr: r, fc: c, tr: r1, tc, capture: target, promo });
                  } else {
                    moves.push({ fr: r, fc: c, tr: r1, tc, capture: target });
                  }
                } else if (s.ep && s.ep.r === r1 && s.ep.c === tc) {
                  const epVictim = b[r][tc];
                  if (epVictim && epVictim.color === enemy && epVictim.type === 'p') {
                    moves.push({ fr: r, fc: c, tr: r1, tc, epCapture: true, capture: epVictim });
                  }
                }
              }
            } else if (p.type === 'n') {
              for (const [dr, dc] of [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]) {
                const tr = r + dr, tc = c + dc;
                if (!inBounds(tr, tc)) continue;
                const target = b[tr][tc];
                if (!target || target.color === enemy) {
                  moves.push({ fr: r, fc: c, tr, tc, capture: target || null });
                }
              }
            } else if (p.type === 'b' || p.type === 'r' || p.type === 'q') {
              const dirs = [];
              if (p.type !== 'r') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
              if (p.type !== 'b') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
              for (const [dr, dc] of dirs) {
                let tr = r + dr, tc = c + dc;
                while (inBounds(tr, tc)) {
                  const target = b[tr][tc];
                  if (!target) {
                    moves.push({ fr: r, fc: c, tr, tc });
                  } else {
                    if (target.color === enemy) moves.push({ fr: r, fc: c, tr, tc, capture: target });
                    break;
                  }
                  tr += dr; tc += dc;
                }
              }
            } else if (p.type === 'k') {
              for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                  if (!dr && !dc) continue;
                  const tr = r + dr, tc = c + dc;
                  if (!inBounds(tr, tc)) continue;
                  const target = b[tr][tc];
                  if (!target || target.color === enemy) {
                    moves.push({ fr: r, fc: c, tr, tc, capture: target || null });
                  }
                }
              }
              // Castling
              const homeRow = color === 'w' ? 7 : 0;
              if (r === homeRow && c === 4 && !isSquareAttacked(b, r, c, enemy)) {
                const canK = color === 'w' ? s.castling.wK : s.castling.bK;
                const canQ = color === 'w' ? s.castling.wQ : s.castling.bQ;
                if (canK && !b[homeRow][5] && !b[homeRow][6] && b[homeRow][7]?.type === 'r' && b[homeRow][7]?.color === color) {
                  if (!isSquareAttacked(b, homeRow, 5, enemy) && !isSquareAttacked(b, homeRow, 6, enemy)) {
                    moves.push({ fr: r, fc: c, tr: homeRow, tc: 6, castle: 'K' });
                  }
                }
                if (canQ && !b[homeRow][3] && !b[homeRow][2] && !b[homeRow][1] && b[homeRow][0]?.type === 'r' && b[homeRow][0]?.color === color) {
                  if (!isSquareAttacked(b, homeRow, 3, enemy) && !isSquareAttacked(b, homeRow, 2, enemy)) {
                    moves.push({ fr: r, fc: c, tr: homeRow, tc: 2, castle: 'Q' });
                  }
                }
              }
            }
          }
        }
        return moves;
      }

      function applyMoveFast(s, m) {
        const ns = cloneState(s);
        const b = ns.board;
        const moving = b[m.fr][m.fc];
        b[m.fr][m.fc] = null;

        if (m.epCapture) {
          b[m.fr][m.tc] = null;
        }
        if (m.castle === 'K') {
          b[m.fr][5] = b[m.fr][7];
          b[m.fr][7] = null;
        } else if (m.castle === 'Q') {
          b[m.fr][3] = b[m.fr][0];
          b[m.fr][0] = null;
        }

        const placed = m.promo ? { ...moving, type: m.promo } : moving;
        b[m.tr][m.tc] = placed;

        // Castling rights update
        if (moving.type === 'k') {
          if (moving.color === 'w') { ns.castling.wK = false; ns.castling.wQ = false; }
          else { ns.castling.bK = false; ns.castling.bQ = false; }
        }
        if (moving.type === 'r') {
          if (m.fr === 7 && m.fc === 0) ns.castling.wQ = false;
          if (m.fr === 7 && m.fc === 7) ns.castling.wK = false;
          if (m.fr === 0 && m.fc === 0) ns.castling.bQ = false;
          if (m.fr === 0 && m.fc === 7) ns.castling.bK = false;
        }
        if (m.capture && m.capture.type === 'r') {
          if (m.tr === 7 && m.tc === 0) ns.castling.wQ = false;
          if (m.tr === 7 && m.tc === 7) ns.castling.wK = false;
          if (m.tr === 0 && m.tc === 0) ns.castling.bQ = false;
          if (m.tr === 0 && m.tc === 7) ns.castling.bK = false;
        }

        ns.ep = m.doublePawn ? { r: (m.fr + m.tr) / 2, c: m.fc } : null;
        ns.halfMove = (moving.type === 'p' || m.capture) ? 0 : (s.halfMove + 1);
        if (s.turn === 'b') ns.fullMove += 1;
        ns.turn = s.turn === 'w' ? 'b' : 'w';
        return ns;
      }

      function legalMoves(s, color = s.turn) {
        return pseudoMoves(s, color).filter((m) => {
          const ns = applyMoveFast(s, m);
          return !inCheck(ns.board, color);
        });
      }

      function formatAlgebraic(before, move, after, opponentMoves) {
        if (move.castle === 'K') return 'O-O' + (inCheck(after.board, after.turn) ? (opponentMoves.length ? '+' : '#') : '');
        if (move.castle === 'Q') return 'O-O-O' + (inCheck(after.board, after.turn) ? (opponentMoves.length ? '+' : '#') : '');
        const p = before.board[move.fr][move.fc];
        let san = '';
        if (p.type !== 'p') san += p.type.toUpperCase();
        else if (move.capture) san += FILES[move.fc];
        if (move.capture) san += 'x';
        san += sqName(move.tr, move.tc);
        if (move.promo) san += '=' + move.promo.toUpperCase();
        if (inCheck(after.board, after.turn)) {
          san += opponentMoves.length ? '+' : '#';
        }
        return san;
      }

      function evaluateBoard(s) {
        let score = 0;
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = s.board[r][c];
            if (!p) continue;
            const idx = p.color === 'w' ? (r * 8 + c) : ((7 - r) * 8 + c);
            const val = PIECE_VAL[p.type] + (PST[p.type]?.[idx] ?? 0);
            score += p.color === 'w' ? val : -val;
          }
        }
        return score;
      }

      function orderMoves(moves) {
        return moves.sort((a, b) => {
          const sa = (a.capture ? PIECE_VAL[a.capture.type] * 10 : 0) + (a.promo ? 800 : 0) + (a.castle ? 60 : 0);
          const sb = (b.capture ? PIECE_VAL[b.capture.type] * 10 : 0) + (b.promo ? 800 : 0) + (b.castle ? 60 : 0);
          return sb - sa;
        });
      }

      function minimax(s, depth, alpha, beta, maximizing) {
        const moves = legalMoves(s, s.turn);
        if (moves.length === 0) {
          if (inCheck(s.board, s.turn)) {
            return { score: maximizing ? (-99999 - depth) : (99999 + depth), move: null };
          }
          return { score: 0, move: null };
        }
        if (depth === 0) return { score: evaluateBoard(s), move: null };

        orderMoves(moves);
        let bestMove = moves[0];
        if (maximizing) {
          let maxEval = -Infinity;
          for (const m of moves) {
            const ns = applyMoveFast(s, m);
            const ev = minimax(ns, depth - 1, alpha, beta, false).score;
            if (ev > maxEval) { maxEval = ev; bestMove = m; }
            alpha = Math.max(alpha, ev);
            if (beta <= alpha) break;
          }
          return { score: maxEval, move: bestMove };
        } else {
          let minEval = Infinity;
          for (const m of moves) {
            const ns = applyMoveFast(s, m);
            const ev = minimax(ns, depth - 1, alpha, beta, true).score;
            if (ev < minEval) { minEval = ev; bestMove = m; }
            beta = Math.min(beta, ev);
            if (beta <= alpha) break;
          }
          return { score: minEval, move: bestMove };
        }
      }

      function pickAiMove(s, depth) {
        const moves = legalMoves(s, s.turn);
        if (!moves.length) return null;
        const maxSide = s.turn === 'w';
        // Légère variété d'ouverture au 1er coup
        if (s.history.length < 2 && Math.random() < 0.35) {
          const topMoves = moves.filter((m) => ['e2e4','d2d4','c2c4','g1f3','e7e5','d7d5','c7c5','g8f6'].includes(sqName(m.fr, m.fc) + sqName(m.tr, m.tc)));
          if (topMoves.length) return topMoves[Math.floor(Math.random() * topMoves.length)];
        }
        return minimax(s, depth, -Infinity, Infinity, maxSide).move;
      }

      function isInsufficientMaterial(board) {
        const pieces = [];
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = board[r][c];
            if (p && p.type !== 'k') pieces.push(p);
          }
        }
        if (pieces.length === 0) return true;
        if (pieces.length === 1 && (pieces[0].type === 'n' || pieces[0].type === 'b')) return true;
        return false;
      }

      /* ================================================================

       * ================================================================ */
      let soundEnabled = true;

      function playSound(kind) {
        if (!soundEnabled) return;
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') void audioCtx.resume();
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          if (kind === 'move') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(195, now);
            osc.frequency.exponentialRampToValueAtTime(95, now + 0.065);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.08);
          } else if (kind === 'capture') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(70, now + 0.12);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.14);
          } else if (kind === 'check') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(660, now);
            osc.frequency.exponentialRampToValueAtTime(440, now + 0.22);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.25);
          }
        } catch {}
      }

      function updateCamera(dt) {
        if (camCtrl.autoRotate && !camCtrl.dragging) {
          camCtrl.targetTheta += dt * 0.25;

        const k = 1 - Math.exp(-10 * dt);
        camCtrl.theta += (camCtrl.targetTheta - camCtrl.theta) * k;
        camCtrl.phi += (camCtrl.targetPhi - camCtrl.phi) * k;
        camCtrl.radius += (camCtrl.targetRadius - camCtrl.radius) * k;
        const sinPhi = Math.sin(camCtrl.phi);
        camera.position.set(
          camCtrl.radius * sinPhi * Math.sin(camCtrl.theta),
          camCtrl.radius * Math.cos(camCtrl.phi),
          camCtrl.radius * sinPhi * Math.cos(camCtrl.theta)
        );
        camera.lookAt(0, 0.35, 0);

      // Textures procédurales marbre & bois
      function makeMarbleTexture(baseHex, veinHex) {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = baseHex;
        ctx.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 24; i++) {
          ctx.strokeStyle = veinHex;
          ctx.globalAlpha = 0.07 + Math.random() * 0.08;
          ctx.lineWidth = 0.8 + Math.random() * 2.2;
          ctx.beginPath();
          let x = Math.random() * 256, y = Math.random() * 256;
          ctx.moveTo(x, y);
          for (let s = 0; s < 6; s++) {
            x += (Math.random() - 0.35) * 65;
            y += (Math.random() - 0.35) * 65;
            ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        return tex;

      // Générateur de pièces 3D Staunton (LatheGeometry + détails)
      function latheFromProfile(pts, segs = 28) {
        const vecs = pts.map(([x, y]) => new THREE.Vector2(x, y));
        const g = new THREE.LatheGeometry(vecs, segs);
        g.computeVertexNormals();
        return g;

          if (ry) m.rotation.y = ry;
          if (rz) m.rotation.z = rz;
          m.castShadow = true;

          g.add(m);
          return m;

        if (type === 'p') {

      /* ================================================================

      const particles = [];
      function spawnCaptureBurst(pos, color) {
        const geo = new THREE.SphereGeometry(0.055, 8, 8);
        const mat = new THREE.MeshBasicMaterial({ color: color === 'w' ? 0xfff3d6 : 0x6ab4ff, transparent: true, opacity: 1 });

      function syncPieces3D(s, animatedMove = null) {
        const seen = new Set();
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = s.board[r][c];
            if (!p) continue;
            seen.add(p.id);
            let rec = pieceMeshes.get(p.id);
            if (!rec || rec.type !== p.type) {
              if (rec) piecesGroup.remove(rec.group);
              const grp = buildPieceMesh(p.type, p.color);
              grp.position.copy(boardToWorld(r, c));
              piecesGroup.add(grp);
              rec = { group: grp, type: p.type, color: p.color, anim: null };
              pieceMeshes.set(p.id, rec);
            }
            const target = boardToWorld(r, c);
            const cur = rec.group.position;
            if (animatedMove && cur.distanceTo(target) > 0.05) {
              rec.anim = {
                from: cur.clone(),
                to: target.clone(),
                t: 0,
                dur: 0.26,
              };
            } else if (!rec.anim) {
              rec.group.position.copy(target);
            }
          }
        }
        for (const [id, rec] of [...pieceMeshes.entries()]) {
          if (!seen.has(id)) {
            spawnCaptureBurst(rec.group.position, rec.color);
            piecesGroup.remove(rec.group);
            pieceMeshes.delete(id);
          }
        }
      }

      /* ================================================================
       * 5. ÉTAT DU JEU & INTERACTION UTILISATEUR
       * ================================================================ */
      let state = createInitialState();
      let selected = null;
      let currentLegal = [];
      let lastMove = null;
      let hintMove = null;
      let aiTimer = null;
      let gameOverInfo = null;
      let pendingPromotion = null;

      const $ = (id) => document.getElementById(id);

      function updateHighlights() {
        const checkKing = inCheck(state.board, state.turn) ? findKing(state.board, state.turn) : null;
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const hl = highlightMeshes[r][c];
            const ring = legalRingMeshes[r][c];
            hl.material.opacity = 0;
            ring.visible = false;

            if (lastMove && ((lastMove.fr === r && lastMove.fc === c) || (lastMove.tr === r && lastMove.tc === c))) {
              hl.material.color.setHex(0xffd60a);
              hl.material.opacity = 0.24;
            }
            if (hintMove && ((hintMove.fr === r && hintMove.fc === c) || (hintMove.tr === r && hintMove.tc === c))) {
              hl.material.color.setHex(0xbf5af2);
              hl.material.opacity = 0.42;
            }
            if (selected && selected.r === r && selected.c === c) {
              hl.material.color.setHex(0x0a84ff);
              hl.material.opacity = 0.45;
            }
            if (checkKing && checkKing.r === r && checkKing.c === c) {
              hl.material.color.setHex(0xff453a);
              hl.material.opacity = 0.58;
            }

            const legalHit = currentLegal.find((m) => m.tr === r && m.tc === c);
            if (legalHit) {
              ring.visible = true;
              ring.material.color.setHex(legalHit.capture ? 0xff453a : 0x30d158);
            }
          }
        }
      }

      function updateHud(isAiThinking = false) {
        const moves = legalMoves(state, state.turn);
        const check = inCheck(state.board, state.turn);
        gameOverInfo = null;
        if (moves.length === 0) {
          gameOverInfo = check
            ? { over: true, text: state.turn === 'w' ? 'Mat — Noirs gagnent' : 'Mat — Blancs gagnent' }
            : { over: true, text: 'Pat — Partie nulle' };
        } else if (state.halfMove >= 100 || isInsufficientMaterial(state.board)) {
          gameOverInfo = { over: true, text: 'Nulle' };
        }

        $('turnOrb').className = 'turn-orb ' + state.turn;
        $('turnLabel').textContent = state.turn === 'w' ? 'Trait aux Blancs' : 'Trait aux Noirs';

        const pill = $('statusPill');
        if (gameOverInfo) {
          pill.textContent = gameOverInfo.text;
          pill.className = 'status-pill over';
        } else if (isAiThinking) {
          pill.textContent = 'IA réfléchit…';
          pill.className = 'status-pill think';
        } else if (check) {
          pill.textContent = 'Échec !';
          pill.className = 'status-pill check';
        } else {
          pill.textContent = 'En cours';
          pill.className = 'status-pill';
        }

        // Captures & avantage matériel
        const scoreW = state.capturedB.reduce((a, t) => a + PIECE_VAL[t], 0);
        const scoreB = state.capturedW.reduce((a, t) => a + PIECE_VAL[t], 0);
        const diff = Math.round((scoreW - scoreB) / 100);
        $('capWhite').textContent = state.capturedB.length ? state.capturedB.map((t) => UNICODE_B[t]).join(' ') : '—';
        $('capBlack').textContent = state.capturedW.length ? state.capturedW.map((t) => UNICODE_W[t]).join(' ') : '—';
        $('advWhite').textContent = diff > 0 ? `+${diff}` : '';
        $('advBlack').textContent = diff < 0 ? `+${Math.abs(diff)}` : '';

        // Historique algébrique
        const rows = [];
        for (let i = 0; i < state.history.length; i += 2) {
          const n = Math.floor(i / 2) + 1;
          rows.push(`<div class="move-row"><span class="move-num">${n}.</span><span>${state.history[i] || ''}</span><span>${state.history[i + 1] || ''}</span></div>`);
        }
        const ml = $('movesList');
        ml.innerHTML = rows.join('') || '<div style="color:var(--muted)">Aucun coup joué</div>';
        ml.scrollTop = ml.scrollHeight;

        updateHighlights();
      }

      function executeMove(move) {
        const before = cloneState(state);
        const snap = {
          board: before.board,
          turn: before.turn,
          castling: before.castling,
          ep: before.ep,
          halfMove: before.halfMove,
          fullMove: before.fullMove,
          capturedW: before.capturedW,
          capturedB: before.capturedB,
          history: before.history,
          lastMove,
        };
        const next = applyMoveFast(state, move);
        next.snapshots = [...state.snapshots, snap];
        if (move.capture) {
          if (move.capture.color === 'w') next.capturedW.push(move.capture.type);
          else next.capturedB.push(move.capture.type);
        }
        const oppMoves = legalMoves(next, next.turn);
        const san = formatAlgebraic(before, move, next, oppMoves);
        next.history.push(san);

        state = next;
        lastMove = move;
        selected = null;
        currentLegal = [];
        hintMove = null;

        syncPieces3D(state, move);
        if (inCheck(state.board, state.turn)) playSound('check');
        else if (move.capture) playSound('capture');
        else playSound('move');

        updateHud(false);
        scheduleAiIfNeeded();
      }

      function openPromotionDialog(matchingMoves) {
        pendingPromotion = matchingMoves;
        const modal = $('promoModal');
        const grid = $('promoGrid');
        const map = state.turn === 'w' ? UNICODE_W : UNICODE_B;
        const labels = { q: 'Dame', r: 'Tour', b: 'Fou', n: 'Cavalier' };
        grid.innerHTML = ['q', 'r', 'b', 'n'].map((t) =>
          `<button type="button" class="promo-btn" data-promo="${t}"><span>${map[t]}</span><span>${labels[t]}</span></button>`
        ).join('');
        modal.hidden = false;
      }

      $('promoGrid').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-promo]');
        if (!btn || !pendingPromotion) return;
        const chosen = pendingPromotion.find((m) => m.promo === btn.dataset.promo);
        $('promoModal').hidden = true;
        pendingPromotion = null;
        if (chosen) executeMove(chosen);
      });

      function scheduleAiIfNeeded() {
        clearTimeout(aiTimer);
        if (gameOverInfo) return;
        const mode = $('modeSelect').value;
        const shouldAiPlay = mode === 'aivsai' || (mode === 'ai' && state.turn === 'b');
        if (!shouldAiPlay) return;
        updateHud(true);
        aiTimer = setTimeout(() => {
          const depth = Number($('depthSelect').value) || 2;
          const m = pickAiMove(state, depth);
          if (m) executeMove(m);
          else updateHud(false);
        }, mode === 'aivsai' ? 320 : 240);
      }

      function handleSquareClick(r, c) {
        if (gameOverInfo || pendingPromotion) return;
        const mode = $('modeSelect').value;
        if (mode === 'aivsai' || (mode === 'ai' && state.turn === 'b')) return;

        const matching = currentLegal.filter((m) => m.tr === r && m.tc === c);
        if (matching.length) {
          if (matching.length > 1 && matching[0].promo) {
            openPromotionDialog(matching);
          } else {
            executeMove(matching[0]);
          }
          return;
        }

        const p = state.board[r][c];
        if (p && p.color === state.turn) {
          selected = { r, c };
          currentLegal = legalMoves(state, state.turn).filter((m) => m.fr === r && m.fc === c);
          updateHighlights();
        } else {
          selected = null;
          currentLegal = [];
          updateHighlights();
        }
      }

      // Raycasting + Drag caméra
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      renderer.domElement.addEventListener('pointerdown', (e) => {
        camCtrl.dragging = true;
        camCtrl.movedDist = 0;
        camCtrl.lastX = e.clientX;
        camCtrl.lastY = e.clientY;
      });
      window.addEventListener('pointermove', (e) => {
        if (!camCtrl.dragging) return;
        const dx = e.clientX - camCtrl.lastX;
        const dy = e.clientY - camCtrl.lastY;
        camCtrl.lastX = e.clientX;
        camCtrl.lastY = e.clientY;
        camCtrl.movedDist += Math.hypot(dx, dy);
        camCtrl.targetTheta -= dx * 0.0085;
        camCtrl.targetPhi = Math.max(0.22, Math.min(1.42, camCtrl.targetPhi - dy * 0.0075));
      });
      window.addEventListener('pointerup', (e) => {
        if (!camCtrl.dragging) return;
        camCtrl.dragging = false;
        if (camCtrl.movedDist < 6 && e.button === 0 && e.target === renderer.domElement) {
          const rect = renderer.domElement.getBoundingClientRect();
          pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(pointer, camera);
          const hits = raycaster.intersectObjects(raycastTargets, false);
          if (hits.length) {
            const { r, c } = hits[0].object.userData;
            handleSquareClick(r, c);
          }
        }
      });
      renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
      renderer.domElement.addEventListener('wheel', (e) => {
        e.preventDefault();
        camCtrl.targetRadius = Math.max(7.5, Math.min(22, camCtrl.targetRadius + e.deltaY * 0.008));
      }, { passive: false });

      // Boutons HUD
      $('newGameBtn').onclick = () => {
        clearTimeout(aiTimer);
        state = createInitialState();
        selected = null;
        currentLegal = [];
        lastMove = null;
        hintMove = null;
        for (const [, rec] of pieceMeshes) piecesGroup.remove(rec.group);
        pieceMeshes.clear();
        syncPieces3D(state);
        updateHud(false);
        scheduleAiIfNeeded();
      };

      $('undoBtn').onclick = () => {
        clearTimeout(aiTimer);
        if (!state.snapshots.length) return;
        const mode = $('modeSelect').value;
        const steps = (mode === 'ai' && state.turn === 'w' && state.snapshots.length >= 2) ? 2 : 1;
        let snap = null;
        const snaps = [...state.snapshots];
        for (let i = 0; i < steps && snaps.length; i++) snap = snaps.pop();
        if (!snap) return;
        state = {
          board: snap.board,
          turn: snap.turn,
          castling: snap.castling,
          ep: snap.ep,
          halfMove: snap.halfMove,
          fullMove: snap.fullMove,
          capturedW: snap.capturedW,
          capturedB: snap.capturedB,
          history: snap.history,
          snapshots: snaps,
        };
        lastMove = snap.lastMove || null;
        selected = null;
        currentLegal = [];
        hintMove = null;
        syncPieces3D(state);
        updateHud(false);
      };

      $('hintBtn').onclick = () => {
        if (gameOverInfo) return;
        hintMove = pickAiMove(state, 2);
        updateHighlights();
        if (hintMove) {
          $('hintToast').innerHTML = `<strong>Indice :</strong> ${sqName(hintMove.fr, hintMove.fc)} → ${sqName(hintMove.tr, hintMove.tc)}`;
        }
      };

      $('modeSelect').onchange = () => scheduleAiIfNeeded();
      $('soundBtn').onclick = () => {
        soundEnabled = !soundEnabled;
        $('soundBtn').textContent = soundEnabled ? 'Son : Oui' : 'Son : Non';
        $('soundBtn').classList.toggle('on', soundEnabled);
      };

      document.querySelectorAll('[data-cam]').forEach((b) => {
        b.onclick = () => {
          camCtrl.autoRotate = false;
          $('autoRotateBtn').classList.remove('on');
          const v = b.dataset.cam;
          if (v === 'white') { camCtrl.targetTheta = 0; camCtrl.targetPhi = 0.72; camCtrl.targetRadius = 13.4; }
          else if (v === 'black') { camCtrl.targetTheta = Math.PI; camCtrl.targetPhi = 0.72; camCtrl.targetRadius = 13.4; }
          else if (v === 'top') { camCtrl.targetTheta = 0; camCtrl.targetPhi = 0.22; camCtrl.targetRadius = 13.8; }
        };
      });
      $('autoRotateBtn').onclick = () => {
        camCtrl.autoRotate = !camCtrl.autoRotate;
        $('autoRotateBtn').classList.toggle('on', camCtrl.autoRotate);
      };

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Initialisation
      syncPieces3D(state);
      updateHud(false);

      let prevTime = performance.now();
      function animate(now) {
        requestAnimationFrame(animate);
        const dt = Math.min(0.05, (now - prevTime) / 1000);
        prevTime = now;

        updateCamera(dt);

        // Animation parabolique des pièces
        for (const rec of pieceMeshes.values()) {
          if (!rec.anim) continue;
          rec.anim.t += dt / rec.anim.dur;
          if (rec.anim.t >= 1) {
            rec.group.position.copy(rec.anim.to);
            rec.anim = null;
          } else {
            const u = rec.anim.t;
            const ease = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
            rec.group.position.lerpVectors(rec.anim.from, rec.anim.to, ease);
            rec.group.position.y += Math.sin(u * Math.PI) * 0.72;
          }
        }

        // Particules de capture
        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.life += dt;
          if (pt.life >= pt.maxLife) {
            scene.remove(pt.mesh);
            particles.splice(i, 1);
            continue;
          }
          pt.vy -= 9.5 * dt;
          pt.mesh.position.x += pt.vx * dt;
          pt.mesh.position.y = Math.max(0.08, pt.mesh.position.y + pt.vy * dt);
          pt.mesh.position.z += pt.vz * dt;
          pt.mesh.material.opacity = 1 - pt.life / pt.maxLife;
        }

        renderer.render(scene, camera);
      }
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
